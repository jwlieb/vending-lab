[project]
name = "vending-lab"
version = "0.1.0"
description = "Research harness for evaluating memory and operating policies in Prosus Vending Bench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==2.11.3",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<0.14",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
